name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: .venv/bin/ruff check src tests scripts examples browser_tests
      - name: Type check
        run: .venv/bin/mypy
      - name: Architecture boundaries
        run: .venv/bin/python scripts/check_imports.py
      - name: Tests + coverage
        run: .venv/bin/pytest -q --cov=yai_scout --cov-report=term-missing:skip-covered
      - name: Version consistency
        run: .venv/bin/python scripts/check_version.py --check-tag

  browser:
    name: browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync --extra dev --python 3.12
      - name: Install Playwright
        run: uv pip install --python .venv/bin/python playwright==1.64.1
      - name: Install Chromium
        run: .venv/bin/playwright install --with-deps chromium
      - name: Admin Playwright smoke
        run: .venv/bin/pytest -q browser_tests

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image
        run: docker build -t yai-scout:ci .



