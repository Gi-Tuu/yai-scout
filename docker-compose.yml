services:
  benchmark:
    build: .
    environment:
      SCOUT_MODE: benchmark
      PORT: 8010
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.suanli.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash-1017}
    ports:
      - "8010:8010"
    volumes:
      - ./data/benchmark:/app/data

  freshness:
    build: .
    environment:
      SCOUT_MODE: freshness
      PORT: 8010
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.suanli.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash-1017}
    ports:
      - "8011:8010"
    volumes:
      - ./data/freshness:/app/data

