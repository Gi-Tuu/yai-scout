<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAI Scout — Freshness Verdict Labeling</title>
<style>
  :root{--bg:#0b0f14;--panel:#121821;--line:#1f2a37;--text:#e6e9ef;--muted:#8b98a9;--accent:#f5a524;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(1200px 700px at 20% -10%,#16202c 0%,var(--bg) 55%);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;gap:14px;align-items:baseline;padding:18px 26px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0} h1 span{color:var(--accent)} .tag{color:var(--muted);font-size:12px}
  main{max-width:1100px;margin:0 auto;padding:20px 26px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  input{background:#0f141c;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px;width:300px;font:inherit}
  button{background:var(--accent);color:#1b1206;border:0;border-radius:7px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:12px;margin-right:6px}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
  button.ok{background:var(--ok);color:#052e16} button.bad{background:var(--bad);color:#450a0a}
  table{width:100%;border-collapse:collapse;font-size:12px} th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
  .mono{font-family:var(--mono)} .muted{color:var(--muted)} .case-title{font-size:18px;margin:6px 0 10px}
  .claim{background:#0f141c;border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}
</style>
<link rel="stylesheet" href="/static/tokens.css" />
</head>
<body>
<header>
  <h1>YAI <span>Scout</span> · Freshness Verdict Labeling</h1>
  <div class="tag">private cases · labels stay in this browser</div>
</header>
<main>
  <div class="panel">
    <h2>Annotator</h2>
    <input id="labeler" placeholder="your name" />
    <span id="progress" class="muted"></span>
    <div class="muted" style="font-size:12px;margin-top:8px">Label each claim as fresh / stale / conflicted / insufficient. Export the JSON and hand it over out-of-band. Do not commit labels.</div>
  </div>
  <div class="panel">
    <h2>Private verification set</h2>
    <div id="casePanel" class="muted">loading…</div>
    <div style="margin-top:14px">
      <button id="prev" class="ghost">← prev</button>
      <button id="next" class="ghost">next →</button>
      <button id="export">Export labels JSON</button>
      <span id="hint" class="muted"></span>
    </div>
  </div>
</main>
<script src="/static/js/label-verdict.js"></script>
</body>
</html>
