<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAI Scout — Anchor Admin</title>
<style>
  :root{--bg:#0b0f14;--panel:#121821;--line:#1f2a37;--text:#e6e9ef;--muted:#8b98a9;--accent:#f5a524;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(1200px 700px at 20% -10%,#16202c 0%,var(--bg) 55%);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;gap:14px;align-items:baseline;padding:18px 26px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0} h1 span{color:var(--accent)} .tag{color:var(--muted);font-size:12px}
  main{max-width:1200px;margin:0 auto;padding:20px 26px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  input{background:#0f141c;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px;width:420px;font:inherit}
  button{background:var(--accent);color:#1b1206;border:0;border-radius:7px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:12px;margin-right:6px}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
  button.danger{background:#7f1d1d;color:#fff}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
  .mono{font-family:var(--mono)} .muted{color:var(--muted)}
  .badge{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>YAI <span>Scout</span> · Anchor Admin</h1>
  <div class="tag">candidate → gate → approve / reject / rollback</div>
  <div style="margin-left:auto"><a href="/" style="color:var(--accent)">首页</a></div>
</header>
<main>
  <div class="panel">
    <h2>Admin token</h2>
    <input id="token" type="password" placeholder="ADMIN_TOKEN" />
    <button id="load">加载</button>
    <span id="status" class="muted"></span>
    <div class="muted" style="font-size:12px;margin-top:6px">token 只保存在 sessionStorage；所有写操作需要服务端 ADMIN_TOKEN。</div>
  </div>
  <div class="panel">
    <h2>Anchors</h2>
    <table><thead><tr><th>状态</th><th>id</th><th>value</th><th>tier</th><th>url</th><th>supersedes</th><th>操作</th></tr></thead><tbody id="anchors"></tbody></table>
  </div>
  <div class="panel">
    <h2>Candidates</h2>
    <table><thead><tr><th>状态</th><th>gate</th><th>旧 → 新</th><th>confidence</th><th>reason</th><th>操作</th></tr></thead><tbody id="candidates"></tbody></table>
  </div>
  <div class="panel">
    <h2>Audit</h2>
    <table><thead><tr><th>id</th><th>action</th><th>anchor</th><th>related</th><th>time</th></tr></thead><tbody id="audit"></tbody></table>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s || "").replace(/[<>&"]/g, (c) => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const safeUrl = (value) => {
  try {
    const parsed = new URL(String(value || ""), window.location.origin);
    return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "#";
  } catch {
    return "#";
  }
};

let token = sessionStorage.getItem("adminToken") || "";
$("token").value = token;

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {...(options.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json"},
  });
  if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
  return response.json();
}

async function load() {
  token = $("token").value.trim();
  sessionStorage.setItem("adminToken", token);
  try {
    const [anchors, candidates, audit] = await Promise.all([
      api("/admin/anchors"),
      api("/admin/anchors/candidates"),
      api("/admin/anchors/audit"),
    ]);
    $("status").textContent = `anchors=${anchors.anchors.length} candidates=${candidates.candidates.length}`;
    renderAnchors(anchors.anchors);
    renderCandidates(candidates.candidates);
    renderAudit(audit.audit);
  } catch (error) {
    $("status").textContent = `加载失败：${error.message}`;
  }
}

function renderAnchors(items) {
  $("anchors").innerHTML = items.map((anchor) => `<tr>
    <td><span class="badge ${anchor.status === "active" ? "ok" : "muted"}">${esc(anchor.status)}</span></td>
    <td class="mono">${esc(anchor.id)}</td>
    <td class="mono">${esc(anchor.last_value)}</td>
    <td>T${anchor.source_tier}</td>
    <td><a style="color:var(--accent)" href="${esc(safeUrl(anchor.url))}" target="_blank" rel="noopener noreferrer">${esc(anchor.url)}</a></td>
    <td class="mono">${esc(anchor.supersedes || "—")}</td>
    <td>${anchor.status === "active" && anchor.supersedes ? `<button class="danger" onclick="rollback('${esc(anchor.id)}')">Rollback</button>` : ""}</td>
  </tr>`).join("");
}

function renderCandidates(items) {
  $("candidates").innerHTML = items.map((candidate) => `<tr>
    <td><span class="badge">${esc(candidate.accuracy_status)}</span></td>
    <td><span class="badge ${candidate.gate_decision === "auto_update" ? "ok" : "warn"}">${esc(candidate.gate_decision)}</span></td>
    <td class="mono">${esc(candidate.old_value)} → ${esc(candidate.new_value)}</td>
    <td>${candidate.confidence}</td>
    <td class="muted">${esc(candidate.gate_reason)}</td>
    <td>${candidate.accuracy_status === "pending" ? `<button onclick="approve('${esc(candidate.id)}')">Approve</button><button class="ghost" onclick="reject('${esc(candidate.id)}')">Reject</button>` : ""}</td>
  </tr>`).join("");
}

function renderAudit(items) {
  $("audit").innerHTML = items.map((item) => `<tr>
    <td class="mono">${item.id}</td>
    <td><span class="badge">${esc(item.action)}</span></td>
    <td class="mono">${esc(item.anchor_id)}</td>
    <td class="mono">${esc(item.related_id || "—")}</td>
    <td class="muted">${esc(item.created_at)}</td>
  </tr>`).join("");
}

async function rollback(id) {
  if (!confirm(`Rollback ${id}?`)) return;
  try {
    await api(`/admin/anchors/${id}/rollback`, {method: "POST"});
    await load();
  } catch (error) { alert(error.message); }
}
async function approve(id) {
  try {
    await api(`/admin/anchors/candidates/${id}/approve`, {method: "POST"});
    await load();
  } catch (error) { alert(error.message); }
}
async function reject(id) {
  try {
    await api(`/admin/anchors/candidates/${id}/reject`, {method: "POST"});
    await load();
  } catch (error) { alert(error.message); }
}

$("load").onclick = load;
if (token) load();
</script>
</body>
</html>
