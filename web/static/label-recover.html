<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAI Scout — Recover Labels</title>
<style>
  body{margin:0;padding:28px;background:#0b0f14;color:#e6e9ef;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
  main{max-width:900px;margin:0 auto}
  h1{font-size:18px;margin:0 0 6px} h1 span{color:#f5a524}
  .muted{color:#8b98a9;font-size:12px}
  textarea{width:100%;height:360px;margin-top:14px;background:#0f141c;color:#e6e9ef;border:1px solid #1f2a37;border-radius:10px;padding:10px;font:12px/1.5 Consolas,monospace}
  button{background:#f5a524;color:#1b1206;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;margin-right:8px}
  button.ghost{background:transparent;color:#8b98a9;border:1px solid #1f2a37;font-weight:400}
</style>
</head>
<body>
<main>
  <h1>YAI <span>Scout</span> · Recover Labels</h1>
  <p class="muted">从当前浏览器 localStorage 读取已填写的 accuracy labels。只有在同一浏览器、同一域名下填写过才有效。</p>
  <div class="muted" id="meta">读取中…</div>
  <textarea id="json" readonly></textarea>
  <p>
    <button id="download">下载 labels JSON</button>
    <button class="ghost" id="copy">复制 JSON</button>
  </p>
  <div class="muted" id="status"></div>
</main>
<script src="/static/js/label-recover.js"></script>
</body>
</html>
