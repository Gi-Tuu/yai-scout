<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAI Scout — Benchmark</title>
<style>
  :root { --bg:#0b0f14; --panel:#121821; --panel2:#0f141c; --line:#1f2a37; --text:#e6e9ef;
          --muted:#8b98a9; --accent:#f5a524; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
          --mono:ui-monospace,"Cascadia Code",Consolas,monospace; }
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#16202c 0%,var(--bg) 55%);
    color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  header{display:flex;align-items:baseline;gap:14px;padding:20px 28px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0} h1 span{color:var(--accent)} .tag{color:var(--muted);font-size:12px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  main{max-width:1180px;margin:0 auto;padding:20px 28px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
  button{background:var(--accent);color:#1b1206;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);cursor:pointer}
  .chip.on{color:var(--accent);border-color:#7a5314}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .num{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .bar{height:6px;background:#1b2430;border-radius:999px;overflow:hidden;min-width:80px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#fbbf24,#34d399)}
  .status{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .hidden{display:none}
  .claim{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>YAI <span>Scout</span> · Benchmark</h1>
  <div class="tag">研究型 Agent 评测：答案对不对 + 信息新不新 + 证据硬不硬</div>
  <div style="margin-left:auto"><a href="/">首页</a> · <a href="/freshness">Freshness</a></div>
</header>
<main>
  <div class="panel">
    <h2>选择参赛 Agent 与题目</h2>
    <div class="row">
      <button id="run">运行评测</button>
      <span class="status" id="status">idle</span>
      <span class="muted" id="hint">repeats 1–5；可选故障注入；公开页默认只跑 synthetic agents；真实 agent 需 admin token</span>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="status">Repeats <input id="repeats" type="number" min="1" max="5" value="1" style="width:56px"></label>
      <label class="status"><input id="inject" type="checkbox"> failure injection (20%)</label>
    </div>
    <div class="chips" id="agents"></div>
    <div class="chips" id="tasks" style="max-height:120px;overflow:auto"></div>
  </div>

  <div class="panel hidden" id="board-panel">
    <h2>Leaderboard <span class="muted" id="session-id"></span></h2>
    <table id="board"></table>
  </div>

  <div class="panel hidden" id="detail-panel">
    <h2>题目明细</h2>
    <div id="detail"></div>
  </div>
</main>

<script src="/static/js/bench.js"></script>
</body>
</html>
