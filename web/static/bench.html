<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAI Scout — Benchmark</title>
<style>
  :root { --bg:#0b0f14; --panel:#121821; --panel2:#0f141c; --line:#1f2a37; --text:#e6e9ef;
          --muted:#8b98a9; --accent:#f5a524; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
          --mono:ui-monospace,"Cascadia Code",Consolas,monospace; }
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#16202c 0%,var(--bg) 55%);
    color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  header{display:flex;align-items:baseline;gap:14px;padding:20px 28px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0} h1 span{color:var(--accent)} .tag{color:var(--muted);font-size:12px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  main{max-width:1180px;margin:0 auto;padding:20px 28px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
  button{background:var(--accent);color:#1b1206;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);cursor:pointer}
  .chip.on{color:var(--accent);border-color:#7a5314}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .num{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .bar{height:6px;background:#1b2430;border-radius:999px;overflow:hidden;min-width:80px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#fbbf24,#34d399)}
  .status{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .hidden{display:none}
  .claim{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>YAI <span>Scout</span> · Benchmark</h1>
  <div class="tag">Bifrost-02 · 研究型 Agent 评测：答案对不对 + 信息新不新 + 证据硬不硬</div>
  <div style="margin-left:auto"><a href="/">研究控制台</a> · <a href="/detector">Detector</a></div>
</header>
<main>
  <div class="panel">
    <h2>选择参赛 Agent 与题目</h2>
    <div class="row">
      <button id="run">运行评测</button>
      <span class="status" id="status">idle</span>
      <span class="muted" id="hint">默认 2 条 claim/答案 做 freshness 核验；13 题全跑约 1–2 分钟</span>
    </div>
    <div class="chips" id="agents"></div>
    <div class="chips" id="tasks" style="max-height:120px;overflow:auto"></div>
  </div>

  <div class="panel hidden" id="board-panel">
    <h2>Leaderboard <span class="muted" id="session-id"></span></h2>
    <table id="board"></table>
  </div>

  <div class="panel hidden" id="detail-panel">
    <h2>题目明细</h2>
    <div id="detail"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { agents: new Set(), tasks: new Set(), timer: null, sessionId: null };
const esc = (s) => (s || "").replace(/[<>&"]/g, (c) => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

init();
async function init() {
  const [a, t] = await Promise.all([
    fetch("/api/benchmark/agents").then((r) => r.json()),
    fetch("/api/benchmark/tasks").then((r) => r.json()),
  ]);
  a.agents.forEach((ag) => {
    const el = document.createElement("span");
    el.className = "chip on"; el.textContent = `${ag.id} · ${ag.name}`;
    el.onclick = () => { toggle(state.agents, ag.id, el); };
    state.agents.add(ag.id); $("agents").appendChild(el);
  });
  t.tasks.forEach((task) => {
    const el = document.createElement("span");
    el.className = "chip on"; el.textContent = task.id;
    el.onclick = () => { toggle(state.tasks, task.id, el); };
    state.tasks.add(task.id); $("tasks").appendChild(el);
  });
}
function toggle(set, id, el) {
  if (set.has(id)) { set.delete(id); el.classList.remove("on"); }
  else { set.add(id); el.classList.add("on"); }
}
$("run").onclick = async () => {
  if (!state.agents.size || !state.tasks.size) return;
  $("run").disabled = true; $("status").textContent = "starting…";
  const res = await fetch("/api/benchmark/run", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ agent_ids: [...state.agents], task_ids: [...state.tasks] })
  });
  if (!res.ok) { $("status").textContent = "failed: " + res.status; $("run").disabled = false; return; }
  const data = await res.json();
  state.sessionId = data.session.id;
  $("session-id").textContent = data.session.id;
  $("board-panel").classList.remove("hidden");
  poll();
  state.timer = setInterval(poll, 1500);
};

async function poll() {
  if (!state.sessionId) return;
  const res = await fetch(`/api/benchmark/sessions/${state.sessionId}`);
  const data = await res.json();
  const session = data.session || {};
  $("status").textContent = `${session.status} · ${data.results.length}/${(session.agent_ids || []).length * (session.task_ids || []).length} 结果`;
  renderBoard(data.leaderboard || []);
  renderDetail(data.results || []);
  if (session.status !== "running") { clearInterval(state.timer); $("run").disabled = false; }
}

function renderBoard(rows) {
  if (!rows.length) { $("board").innerHTML = ""; return; }
  $("board").innerHTML =
    `<tr><th>#</th><th>Agent</th><th>综合分</th><th>数字准确率</th><th>引用率</th><th>陈旧率</th><th>freshness</th><th>时延</th></tr>` +
    rows.map((r, i) => `<tr>
      <td class="num">${i + 1}</td>
      <td>${esc(r.agent_id)}</td>
      <td><div class="row"><span class="num">${r.score}</span><span class="bar" style="width:120px"><i style="width:${Math.round(r.score * 100)}%"></i></span></div></td>
      <td class="num">${r.numeric_accuracy}</td>
      <td class="num">${r.citation_rate}</td>
      <td class="num" style="color:${r.stale_rate > 0.3 ? "#f87171" : "inherit"}">${r.stale_rate}</td>
      <td class="num">${r.freshness_score}</td>
      <td class="num">${r.avg_latency_s}s</td>
    </tr>`).join("");
}

function renderDetail(results) {
  const byTask = {};
  results.forEach((r) => { (byTask[r.task_id] ||= []).push(r); });
  $("detail").innerHTML = Object.entries(byTask).map(([taskId, items]) => {
    const rows = items.map((r) => `<tr>
      <td>${esc(r.agent_id)}</td>
      <td class="num">${r.numeric_accuracy}</td>
      <td class="num">${r.score}</td>
      <td class="num">${r.freshness_score ?? "-"}</td>
      <td class="num">${r.stale_claim_rate === null ? "-" : r.stale_claim_rate}</td>
      <td class="muted" style="max-width:520px">${esc((r.answer.text || "").slice(0, 160))}</td>
    </tr>`).join("");
    return `<div style="margin-bottom:14px"><div class="num" style="font-size:12px">${esc(taskId)}</div>
      <table><tr><th>Agent</th><th>数字准确</th><th>综合分</th><th>freshness</th><th>陈旧率</th><th>答案摘要</th></tr>${rows}</table></div>`;
  }).join("");
}
</script>
</body>
</html>
