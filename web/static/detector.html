<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAI Scout — Stale-answer Detector</title>
<style>
  :root { --bg:#0b0f14; --panel:#121821; --panel2:#0f141c; --line:#1f2a37; --text:#e6e9ef;
          --muted:#8b98a9; --accent:#f5a524; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
          --mono:ui-monospace,"Cascadia Code",Consolas,monospace; }
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#16202c 0%,var(--bg) 55%);
    color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  header{display:flex;align-items:baseline;gap:14px;padding:20px 28px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0} h1 span{color:var(--accent)} .tag{color:var(--muted);font-size:12px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  main{max-width:1080px;margin:0 auto;padding:20px 28px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
  textarea{width:100%;min-height:110px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:10px 12px;font:inherit;outline:none;resize:vertical}
  textarea:focus{border-color:#7a5314}
  button{background:var(--accent);color:#1b1206;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .samples{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .samples button{text-align:left;font-size:12px;font-weight:400;padding:6px 8px}
  .score{display:flex;align-items:center;gap:16px}
  .big{font-family:var(--mono);font-size:42px;font-weight:600}
  .bar{height:8px;background:#1b2430;border-radius:999px;overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#fbbf24,#34d399)}
  .claim{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--panel2)}
  .claim .text{font-size:13px}
  .meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .badge{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
  .badge.fresh{color:var(--ok);border-color:#14532d}.badge.stale{color:var(--bad);border-color:#7f1d1d}
  .badge.conflicted{color:#fb923c;border-color:#7c2d12}.badge.insufficient{color:var(--warn);border-color:#78350f}.badge.unknown{color:var(--muted)}
  .ev{font-size:12px;margin-top:6px;padding-left:10px;border-left:2px solid var(--line)}
  .ev .rel{font-family:var(--mono);font-size:10px;margin-right:6px}
  .sugg{font-size:12px;color:var(--warn);border-left:2px solid #78350f;padding-left:8px;margin-top:6px}
  .muted{color:var(--muted)} .hidden{display:none}
</style>
<link rel="stylesheet" href="/static/tokens.css" />
</head>
<body>
<header>
  <h1>YAI <span>Scout</span> · Stale-answer Detector</h1>
  <div class="tag">Paste any LLM answer → claim-level freshness check</div>
  <div style="margin-left:auto"><a href="/">Research console</a> · <a href="/benchmark">Benchmark</a></div>
</header>
<main>
  <div class="panel">
    <h2>Answer to check</h2>
    <textarea id="answer" placeholder="Paste an LLM-generated answer (including prices, versions, dates or regulations that may be stale)…"></textarea>
    <div class="row">
      <button id="run">Check freshness</button>
      <button class="ghost" id="clear">Clear</button>
      <span class="muted" id="hint">as_of 2026-11-01 · up to 6 claims</span>
    </div>
    <div class="samples" id="samples"></div>
  </div>

  <div class="panel hidden" id="result">
    <h2>Freshness report</h2>
    <div class="score">
      <div class="big" id="overall">0</div>
      <div style="flex:1">
        <div class="muted" id="summary"></div>
        <div class="bar"><i id="bar" style="width:0%"></i></div>
      </div>
    </div>
    <div id="claims"></div>
  </div>
</main>

<script src="/static/js/detector.js"></script>
</body>
</html>
